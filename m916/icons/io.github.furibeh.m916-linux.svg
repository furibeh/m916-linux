<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4d55"/>
      <stop offset="1" stop-color="#1e1f24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#c0141c"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="118" rx="34" ry="6" fill="#000" opacity="0.18"/>
  <!-- body -->
  <path d="M64 8 C38 8 26 28 26 52 L26 78 C26 102 42 116 64 116 C86 116 102 102 102 78 L102 52 C102 28 90 8 64 8 Z"
        fill="url(#body)" stroke="#121317" stroke-width="2"/>
  <!-- button split -->
  <path d="M64 10 L64 50" stroke="#121317" stroke-width="2.5"/>
  <path d="M28 50 Q64 58 100 50" fill="none" stroke="#121317" stroke-width="2.5"/>
  <!-- red side accents -->
  <path d="M30 60 Q30 92 46 106" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M98 60 Q98 92 82 106" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"/>
  <!-- scroll wheel -->
  <rect x="58" y="20" width="12" height="24" rx="6" fill="url(#glow)" stroke="#121317" stroke-width="2"/>
  <path d="M60 27 H68 M60 32 H68 M60 37 H68" stroke="#7a0a10" stroke-width="1.5"/>
  <!-- DPI indicator -->
  <circle cx="64" cy="72" r="5" fill="url(#glow)"/>
  <circle cx="64" cy="72" r="9" fill="none" stroke="#ff4d4d" stroke-width="1.5" opacity="0.5"/>
</svg>
